# Fetch historical visitor statistics from Google Analytics 4 (GA4) and
# write them to analytics.json so the on-page dashboard widgets can show
# real historical visitor counts + visitors-by-country (not just the
# per-browser localStorage counter).
#
# STATUS: ACTIVE. Runs hourly via cron, plus on push to its own files
# (for self-test) and via manual trigger from the Actions tab.
#
# The script (scripts/fetch_analytics.py) exits 0 with a friendly note
# when GA credentials aren't configured yet, so this workflow shows as
# success (not failure) in the Actions tab during the pre-setup period.
# Once the user follows docs/ANALYTICS_SETUP.md and adds the
# GA_CREDENTIALS_JSON secret, the script will start producing
# analytics.json automatically on the next hourly run.
#
# Setup: see docs/ANALYTICS_SETUP.md for the one-time Google Cloud setup
# (create service account, grant Viewer on the GA4 property, add the
# JSON key as the GA_CREDENTIALS_JSON repo secret). The GA_PROPERTY_ID
# variable is optional — the script defaults to 514716245 (the
# waleedmandour.org GA4 property).
name: Update Analytics

on:
  schedule:
    # Run at minute 0 of every hour (UTC). GitHub Actions cron is best-effort
    # and may be delayed during periods of high load, but this is fine — the
    # dashboard degrades gracefully to the last committed analytics.json.
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab (useful for testing
    # the pipeline after configuring GA credentials).
  push:
    # Also re-run whenever the script itself changes, so we can verify
    # changes don't break the pipeline.
    paths:
      - 'scripts/fetch_analytics.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/update-analytics.yml'

# Permission to commit analytics.json back to main.
permissions:
  contents: write

# Don't run multiple update jobs concurrently — they'd race to commit
# and could clobber each other's analytics.json.
concurrency:
  group: 'update-analytics'
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GA4 metrics and write analytics.json
        env:
          # GA_CREDENTIALS_JSON is a repository secret containing the full
          # JSON contents of a Google Cloud service-account key file.
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          # GA_PROPERTY_ID is the numeric GA4 property ID (visible in GA
          # Admin → Property settings). Stored as a plain repo variable
          # (not a secret — it's not sensitive).
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        run: |
          python scripts/fetch_analytics.py

      - name: Check if analytics.json changed
        id: changed
        run: |
          if [ -f analytics.json ]; then
            if git diff --quiet analytics.json 2>/dev/null && ! git ls-files --error-unmatch analytics.json >/dev/null 2>&1; then
              # File is new (untracked) → changed
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet analytics.json 2>/dev/null; then
              # File is tracked and unchanged
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              # File is tracked and changed
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Script didn't write the file. This is expected if GA
            # credentials aren't configured yet — the script exits 0
            # in that case (see scripts/fetch_analytics.py main()).
            # Just skip the commit step.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::analytics.json was not written. This is expected if GA credentials are not configured. See docs/ANALYTICS_SETUP.md."
          fi

      - name: Commit analytics.json
        id: commit
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.json
          git commit -m "chore(analytics): refresh of visitor stats

          Generated by .github/workflows/update-analytics.yml running
          scripts/fetch_analytics.py. See docs/ANALYTICS_SETUP.md for
          setup details."
          # analytics.json is a generated file that's always overwritten
          # wholesale — there's never a reason to merge. If the remote
          # has a newer version from a concurrent run (race condition),
          # just force-push our version. This is safe because:
          #   1. analytics.json is not source code (no human edits to lose)
          #   2. The latest data always wins (that's the whole point)
          # Retry up to 3 times to handle transient network issues.
          for i in 1 2 3; do
            if git push --force-with-lease; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # If --force-with-lease fails (remote moved), fetch + reset
            # to remote main, then re-apply our analytics.json on top
            git fetch origin main
            git reset --soft origin/main
            git add analytics.json
            git commit --amend --no-edit
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 3 retries — analytics.json committed locally but not pushed."
          echo "committed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Trigger Pages deployment
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // GitHub Actions bot commits don't trigger downstream workflows
            // by default (security feature to prevent infinite loops). So
            // we need to manually trigger the Pages deployment workflow
            // after committing analytics.json, otherwise the live site
            // won't update until the next non-bot push.
            const workflow_id = 'static.yml';
            console.log(`Triggering ${workflow_id} workflow_dispatch on main...`);
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main',
              });
              console.log('✓ Pages deployment triggered.');
            } catch (error) {
              // Don't fail the whole workflow if the Pages trigger fails —
              // the next non-bot push will deploy analytics.json anyway.
              console.log(`⚠ Could not trigger Pages deployment: ${error.message}`);
              console.log('analytics.json is committed but may not be live until the next push.');
            }

      - name: Summary
        if: always()
        run: |
          echo "## Update Analytics job summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f analytics.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat analytics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_analytics.json was not produced. Check workflow logs._" >> "$GITHUB_STEP_SUMMARY"
          fi
