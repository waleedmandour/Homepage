# Fetch historical visitor statistics from Google Analytics 4 (GA4) and
# write them to analytics.json so the on-page dashboard widgets can show
# real historical visitor counts + visitors-by-country (not just the
# per-browser localStorage counter).
#
# Runs hourly. The result is committed to the repo so it's served by
# GitHub Pages alongside the rest of the static site.
#
# Setup: see docs/ANALYTICS_SETUP.md for the one-time Google Cloud setup
# (create service account, grant Viewer on the GA4 property, add the
# JSON key as the GA_CREDENTIALS_JSON repo secret, and set GA_PROPERTY_ID).
name: Update Analytics

on:
  schedule:
    # Run at minute 0 of every hour (UTC). GitHub Actions cron is best-effort
    # and may be delayed during periods of high load, but this is fine — the
    # dashboard degrades gracefully to the last committed analytics.json.
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab (useful after first
    # setting up the GA credentials to verify the pipeline works).
  push:
    # Also re-run whenever the script itself changes, so we can verify
    # changes don't break the pipeline before relying on the cron schedule.
    paths:
      - 'scripts/fetch_analytics.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/update-analytics.yml'

# Permission to commit analytics.json back to main.
permissions:
  contents: write

# Don't run multiple update jobs concurrently — they'd race to commit
# and could clobber each other's analytics.json.
concurrency:
  group: 'update-analytics'
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GA4 metrics and write analytics.json
        env:
          # GA_CREDENTIALS_JSON is a repository secret containing the full
          # JSON contents of a Google Cloud service-account key file.
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          # GA_PROPERTY_ID is the numeric GA4 property ID (visible in GA
          # Admin → Property settings). Stored as a plain repo variable
          # (not a secret — it's not sensitive).
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        run: |
          python scripts/fetch_analytics.py

      - name: Check if analytics.json changed
        id: changed
        run: |
          if [ -f analytics.json ]; then
            if git diff --quiet analytics.json 2>/dev/null && ! git ls-files --error-unmatch analytics.json >/dev/null 2>&1; then
              # File is new (untracked) → changed
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet analytics.json 2>/dev/null; then
              # File is tracked and unchanged
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              # File is tracked and changed
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Script didn't write the file (likely missing credentials).
            # Don't fail the workflow — just skip the commit step.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::analytics.json was not written. Check that GA_CREDENTIALS_JSON and GA_PROPERTY_ID are set."
          fi

      - name: Commit analytics.json
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.json
          git commit -m "chore(analytics): hourly refresh of visitor stats

          Generated by .github/workflows/update-analytics.yml running
          scripts/fetch_analytics.py. See docs/ANALYTICS_SETUP.md for
          setup details."
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Update Analytics job summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f analytics.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat analytics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_analytics.json was not produced. Check workflow logs._" >> "$GITHUB_STEP_SUMMARY"
          fi
